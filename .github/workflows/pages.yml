name: Deploy splash to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'splash/**'
      - 'changelog/**'
      - 'context-v/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Single-project repo: the splash reads ../changelog and ../context-v
          # as plain files. No submodules.
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: splash/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build
        run: pnpm build
        env:
          # OpenPanel client ID: public (it's in the HTML), so a repo Variable,
          # not a Secret. Unset means no analytics script at all.
          OPENPANEL_CLIENT_ID: ${{ vars.OPENPANEL_CLIENT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages (source: GitHub Actions) on the first run.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: splash/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
